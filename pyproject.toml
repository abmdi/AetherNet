[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[project]
name = "aethernet"
version = "0.1.0"
description = "Multi-cloud network intelligence foundation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]
[tool.hatch.build.targets.wheel]
packages = ["src/aethernet"]
[tool.ruff]
line-length = 100
